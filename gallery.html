<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | The Jungle Cat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Herr+Von+Muellerhoff&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== HERO ===== -->
<section class="hero hero-gallery" id="top">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>

  <header>
    <a href="index.html" class="logo">
      <div class="brand-top">THE</div>
      <div class="brand-main">JUNGLE CAT</div>
      <div class="brand-sub">GAINESVILLE FL</div>
    </a>
    <nav id="mainNav">
      <a href="gallery.html" class="nav-gallery">
        <span class="nav-gallery-text">GALLERY</span>
        <img class="nav-gallery-leaf" src="images/gallery-leaf.png" alt="Gallery">
      </a>
    </nav>
    <a class="btn btn-olive" id="bookBtnTop" href="index.html#stay">BOOK YOUR STAY</a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </header>
</section>

<!-- ===== GALLERY ===== -->

<section class="full-gallery">
  <div class="full-gallery-grid" id="fullGalleryGrid"></div>
  <p class="full-gallery-empty" id="fullGalleryEmpty">Gallery images coming soon.</p>
</section>

<!-- ===== FOOTER ===== -->
<footer id="contact">
  <div class="footer-grid">
    <div class="footer-col">
      <div class="logo">
        <div class="brand-top">THE</div>
        <div class="brand-main">JUNGLE CAT</div>
        <div class="brand-sub">GAINESVILLE FL</div>
      </div>
    </div>
    <div class="footer-col">
      <h5>QUICK LINKS</h5>
      <a href="gallery.html">Gallery</a>
    </div>
    <div class="footer-col">
      <h5>FOLLOW ALONG</h5>
      <p>See more jungle vibes and guest adventures.</p>
      <div class="socials">
        <a href="https://www.instagram.com/thejunglecatstay" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></a>
        <a href="https://www.instagram.com/thejunglecatstay" target="_blank" rel="noopener" class="social-handle">@thejunglecatstay</a>
      </div>
    </div>
    <div class="badge">
      <img src="images/badge.png" alt="Stay Wild - The Jungle Cat badge">
    </div>
  </div>
  <div class="footer-bottom">
    <span>© 2026 The Jungle Cat. All rights reserved.</span>
    <span>Gainesville, FL</span>
  </div>
</footer>

<script>
  const toggle = document.getElementById('navToggle');
  const nav = document.getElementById('mainNav');
  toggle.addEventListener('click', () => nav.classList.toggle('open'));
  document.querySelectorAll('nav a').forEach(a => a.addEventListener('click', () => setTimeout(() => nav.classList.remove('open'), 0)));

  // ===== GALLERY IMAGES =====
  // Add the filenames of images placed in images/gallery/ to this list
  // (in the order you want them to appear). The grid and the
  // "coming soon" message below update automatically.
  const galleryImages = [
    "images/gallery/gallery-10.jpg", // exterior, daytime sun flare
    "images/gallery/gallery-12.jpg", // magazine + tea close-up
    "images/gallery/gallery-02.jpg", // bedroom, mirror, Jungle Cat sign on TV
    "images/gallery/gallery-04.jpg", // front door opening
    "images/gallery/gallery-01.jpg", // hallway, moth/butterfly art
    "images/gallery/gallery-17.jpg",
    "images/gallery/gallery-13.jpg", // woman reading, tea, banana-leaf art
    "images/gallery/gallery-09.jpg", // daytime patio, checkered floor
    "images/gallery/gallery-18.jpg",
    "images/gallery/gallery-19.jpg",
    "images/gallery/gallery-20.jpg",
    "images/gallery/gallery-21.jpg", // nightstand lamp, tiger art, window
    "images/gallery/gallery-03.jpg",
    "images/gallery/gallery-05.jpg",
    "images/gallery/gallery-06.jpg",
    "images/gallery/gallery-07.jpg",
    "images/gallery/gallery-08.jpg",
    "images/gallery/gallery-11.jpg",
    "images/gallery/gallery-14.jpg",
    "images/gallery/gallery-15.jpg",
    "images/gallery/gallery-16.jpg", // nighttime backyard patio, moved to bottom
  ];

  const grid = document.getElementById('fullGalleryGrid');
  const empty = document.getElementById('fullGalleryEmpty');

  if (galleryImages.length) {
    empty.style.display = 'none';
    galleryImages.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src;
      img.alt = `The Jungle Cat gallery photo ${i + 1}`;
      img.loading = 'lazy';
      grid.appendChild(img);
    });
  }
</script>

</body>
</html>
